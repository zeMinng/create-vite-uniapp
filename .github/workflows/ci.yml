name: 'ci'
on:
  push:
    branches:
      - '**'
      - '!renovate/**'
    paths-ignore:
      - README.md
      - README.zh-CN.md
      - CONTRIBUTING.md
      - LICENSE
  pull_request:
    branches:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: 'Build & Check'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm ci
      # 新增 oxc 校验：oxlint + oxfmt 格式检查
      - name: Oxc lint & format check
        run: pnpm run lint && pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist
          retention-days: 3

  verify-unit:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        exclude:
          # Node version issues are rarely platform-specific, skip non-active-LTS on Windows/macOS
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    name: 'unit (${{ matrix.os }}, node ${{ matrix.node-version }})'
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist
      - run: pnpm ci
      - name: Run unit tests
        run: pnpm run test:unit

  verify-integration:
    needs: build
    runs-on: ubuntu-latest
    name: 'integration (ubuntu-latest, node 24)'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist
      - run: pnpm ci
      - name: Run integration tests
        run: pnpm run test:integration
